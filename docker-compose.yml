services:

  postgres:
    image: postgres:16
    container_name: minikubex-postgres
    environment:
      POSTGRES_USER: minikubex
      POSTGRES_PASSWORD: minikubex
      POSTGRES_DB: minikubex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: minikubex-redis
    ports:
      - "6379:6379"

volumes:

  postgres_data: